[package]
name = "otm"
version = "0.1.0"
edition = "2021"
description = "otm 的桌面外壳：起核心的监听，把事件交给界面"
publish = false

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
otm-core = { path = "../../core" }

# 发布版：小一点、快一点。界面在 WebView 里跑，Rust 这边只做监听，优化级别不用拉满。
[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
