[package]
name = "otm-core"
version = "0.1.0"
edition = "2021"
description = "otm 的核心：读游戏截图文件名和日志，产出事件"
publish = false

[lib]
name = "otm_core"
path = "src/lib.rs"

[[bin]]
name = "otm-replay"
path = "src/bin/otm-replay.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
time = { version = "0.3", features = ["local-offset"] }
# 问系统"文档"在哪（Windows 上是 SHGetKnownFolderPath）。
dirs = "7"

# 读 EFT 的安装位置。只有 Windows 上有注册表。
[target.'cfg(windows)'.dependencies]
winreg = "0.56"
