<!doctype html>

<body>
<script src="tasktree-data.js"></script>
<script>
const q = new URLSearchParams(location.search);
const scene = q.get('scene') || 'main';
const ME = { x: 820, y: 560, h: 40 };

function glyph(type, r, o = {}) {
  const c = `var(--c-${o.color || type})`, ink = 'rgba(0,0,0,.75)', sw = r * .14, st = 'rgba(0,0,0,.55)';
  let s = '';
  switch (type) {
    case 'extract':
      s = `<circle r="${r}" fill="${c}" stroke="${st}" stroke-width="${sw}"/><path d="M${-r*.45} 0H${r*.4}M${r*.05} ${-r*.38}L${r*.45} 0L${r*.05} ${r*.38}" fill="none" stroke="${ink}" stroke-width="${r*.24}" stroke-linecap="round" stroke-linejoin="round"/>`; break;
    case 'key':
      s = `<rect x="${-r*.9}" y="${-r*.9}" width="${r*1.8}" height="${r*1.8}" rx="${r*.3}" transform="rotate(45)" fill="${c}" stroke="${st}" stroke-width="${sw}"/><circle cx="${-r*.25}" r="${r*.26}" fill="none" stroke="${ink}" stroke-width="${r*.2}"/><path d="M0 0H${r*.55}M${r*.38} 0V${r*.28}" fill="none" stroke="${ink}" stroke-width="${r*.2}" stroke-linecap="round"/>`; break;
    case 'quest':
      s = `<path d="M0 ${-r*1.1}L${r*.95} ${-r*.55}V${r*.55}L0 ${r*1.1}L${-r*.95} ${r*.55}V${-r*.55}Z" fill="${c}" stroke="${st}" stroke-width="${sw}" stroke-linejoin="round"/><path d="M0 ${-r*.5}V${r*.1}" stroke="${ink}" stroke-width="${r*.26}" stroke-linecap="round"/><circle cy="${r*.48}" r="${r*.15}" fill="${ink}"/>`; break;
    case 'loot':
      s = `<rect x="${-r*.85}" y="${-r*.85}" width="${r*1.7}" height="${r*1.7}" rx="${r*.25}" fill="${c}" stroke="${st}" stroke-width="${sw}"/><path d="M${-r*.45} ${-r*.1}H${r*.45}M0 ${-r*.1}V${r*.2}" stroke="${ink}" stroke-width="${r*.2}" stroke-linecap="round"/>`; break;
    case 'boss':
      s = `<path d="M0 ${-r*1.15}L${r*1.1} ${r*.8}H${-r*1.1}Z" fill="${c}" stroke="${st}" stroke-width="${sw}" stroke-linejoin="round"/><circle cy="${r*.2}" r="${r*.22}" fill="${ink}"/>`; break;
    default:
      s = `<circle r="${r*.5}" fill="${c}" opacity=".8"/>`;
  }
  if (o.badge) {
    const b = r * .62, bx = r * .85, by = -r * .85;
    s += `<g transform="translate(${bx} ${by})"><circle r="${b}" fill="#14171c" stroke="${c}" stroke-width="${r*.12}"/>`;
    if (o.badge === 'rub') s += `<text y="${b*.5}" text-anchor="middle" font-size="${b*1.35}" font-weight="700" fill="#fff" style="font-family:'DejaVu Sans',sans-serif">₽</text>`;
    if (o.badge === 'power') s += `<path d="M${b*.15} ${-b*.6}L${-b*.35} ${b*.1}H${b*.05}L${-b*.15} ${b*.6}L${b*.4} ${-b*.1}H0Z" fill="#fff"/>`;
    s += `</g>`;
  }
  if (o.num) {
    const b = r * .62;
    s += `<g transform="translate(${r*.85} ${-r*.85})"><circle r="${b}" fill="var(--accent)"/><text y="${b*.45}" text-anchor="middle" font-size="${b*1.3}" font-weight="700" fill="#14171c">${o.num}</text></g>`;
  }
  return s;
}

// type, x, y, opts
const MARKERS = [
  ['extract', 140, 470, {}], ['extract', 1480, 250, { badge: 'rub' }], ['extract', 1390, 880, { num: 3 }], ['extract', 610, 110, { badge: 'power' }],
  ['extract', 300, 880, { color: 'scav' }], ['extract', 1300, 130, { color: 'scav' }],
  ['key', 700, 470, {}], ['key', 905, 430, {}], ['key', 1010, 610, {}], ['key', 1210, 330, {}], ['key', 380, 720, {}],
  ['quest', 960, 500, { num: 1, focus: 1 }], ['quest', 1150, 700, { num: 2 }], ['quest', 470, 300, {}], ['quest', 730, 760, {}],
  ['boss', 985, 395, {}],
];
const ROUTE = 'M820 560L900 520L960 500L990 600L1040 640L1150 700L1180 720L1390 880';
const TRAIL = [[440, 470], [560, 400], [640, 400], [700, 470], [760, 520], [820, 560]];

function mapBody(opt = {}) {
  const { r = 13, rot = 0, route = true } = opt;
  const up = rot ? ` rotate(${rot})` : '';
  let s = `<defs><pattern id="grid" width="80" height="80" patternUnits="userSpaceOnUse"><path d="M80 0H0V80" fill="none" stroke="var(--grid)" stroke-width="1"/></pattern>
    <radialGradient id="cone" cx="0" cy="0" r="1" gradientUnits="objectBoundingBox" gradientTransform="translate(.5 1)"><stop offset="0" stop-color="#fff" stop-opacity=".3"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></radialGradient></defs>`;
  s += `<rect x="-800" y="-800" width="3200" height="2600" fill="var(--bg)"/>`;
  s += `<path d="M60 120C260 40 520 60 760 50S1300 30 1540 130C1600 330 1580 620 1560 880C1300 960 980 970 700 960S220 960 70 900C20 660 30 330 60 120Z" fill="var(--land)"/>`;
  s += `<path d="M420 200C640 150 980 160 1240 220C1340 400 1330 640 1260 800C980 860 620 850 400 790C330 600 340 380 420 200Z" fill="var(--land2)"/>`;
  s += `<rect x="-800" y="-800" width="3200" height="2600" fill="url(#grid)"/>`;
  for (const [cx, cy, rx, ry] of [[230, 330, 130, 90], [300, 640, 150, 110], [1420, 420, 110, 150], [1380, 740, 130, 90], [760, 880, 190, 55], [820, 140, 220, 50]])
    s += `<ellipse cx="${cx}" cy="${cy}" rx="${rx}" ry="${ry}" fill="var(--forest)"/>`;
  s += `<path d="M-60 560C160 590 250 520 400 560S560 700 640 800S690 960 700 1100" fill="none" stroke="var(--water)" stroke-width="46" stroke-linecap="round"/>`;
  const road = d => `<path d="${d}" fill="none" stroke="var(--road)" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/>`;
  s += road('M40 470H420L560 400H1240L1400 300L1560 250') + road('M610 60V400') + road('M1040 400V640L1180 720L1400 880') + road('M560 400V640H1040') + road('M800 640V940');
  s += `<rect x="330" y="455" width="120" height="30" fill="var(--road)"/>`;
  const B = [[640, 430, 130, 80], [660, 520, 90, 90], [1080, 430, 110, 70], [1090, 520, 70, 100], [1200, 290, 120, 70], [1230, 520, 90, 90],
             [440, 270, 90, 70], [340, 690, 110, 70], [690, 720, 90, 80], [1110, 670, 100, 60], [1290, 390, 80, 60], [280, 400, 80, 50], [520, 800, 90, 60]];
  for (const [x, y, w, h] of B) s += `<rect x="${x}" y="${y}" width="${w}" height="${h}" fill="var(--bld)" stroke="var(--bld-stroke)" stroke-width="1.5"/>`;
  s += `<path d="M830 340H1020V460H960V600H830Z" fill="var(--bld)" stroke="var(--bld-stroke)" stroke-width="2.1"/>`;
  s += `<path d="M830 400H1020M890 340V600M830 470H960M830 535H960M955 400V460" fill="none" stroke="var(--bld-stroke)" stroke-width="1.2" opacity=".7"/>`;
  // trail
  if (opt.me !== 'none') s += `<polyline points="${TRAIL.map(p => p.join(',')).join(' ')}" fill="none" stroke="#fff" stroke-opacity=".28" stroke-width="3" stroke-linejoin="round"/>`;
  if (opt.me !== 'none') for (const [x, y] of TRAIL.slice(0, -1)) s += `<circle cx="${x}" cy="${y}" r="4" fill="#fff" fill-opacity=".45"/>`;
  // route
  if (route) s += `<path d="${ROUTE}" fill="none" stroke="var(--accent)" stroke-width="4" stroke-dasharray="2 10" stroke-linecap="round" stroke-linejoin="round"/>`;
  for (const [t, x, y, o] of MARKERS) {
    if (o.focus) s += `<circle cx="${x}" cy="${y}" r="${r * 2.1}" fill="none" stroke="var(--accent)" stroke-width="2" opacity=".7"/>`;
    s += `<g transform="translate(${x} ${y})${up}">${glyph(t, r, o)}</g>`;
  }
  s += `<g transform="translate(1120 250)${up}"><circle r="${r * 1.35}" fill="var(--c-key)" fill-opacity=".22" stroke="var(--c-key)" stroke-width="${r * .16}"/><text y="${r * .42}" text-anchor="middle" font-size="${r * 1.15}" font-weight="700" fill="var(--c-key)">3</text></g>`;
  s += opt.extra || '';
  if (opt.me !== 'none') {
    const stale = opt.me === 'stale', v = opt.v || 'a';
    const arrow = (fill, stroke, sw) => `<path d="M0 ${-r * 1.5}L${r * 1.05} ${r * 1.1}L0 ${r * .5}L${-r * 1.05} ${r * 1.1}Z" fill="${fill}" stroke="${stroke}" stroke-width="${sw}" stroke-linejoin="round"/>`;
    s += `<g transform="translate(${ME.x} ${ME.y}) rotate(${ME.h})">`;
    if (!stale) s += `<path d="M0 0L-150 -260A300 300 0 0 1 150 -260Z" fill="url(#cone)"/><circle r="${r * 1.5}" fill="#fff" opacity=".16"/>` + arrow('#fff', 'rgba(0,0,0,.6)', r * .14);
    else if (v === 'a') s += `<circle r="${r * 2.3}" fill="rgba(255,210,74,.18)" stroke="var(--accent)" stroke-width="${r * .22}" stroke-dasharray="${r * .5} ${r * .45}"/>` + arrow('var(--accent)', 'rgba(0,0,0,.7)', r * .16);
    else if (v === 'b') s += `<circle r="${r * 2.1}" fill="rgba(20,23,28,.6)"/>` + arrow('none', 'var(--accent)', r * .3);
    else if (v === 'c' || v === 'e' || v === 'f') s += arrow('var(--accent)', 'rgba(0,0,0,.7)', r * .16);
    else s += arrow('var(--accent)', 'rgba(0,0,0,.7)', r * .16);
    s += `</g>`;
    if (stale && (v === 'c' || v === 'e' || v === 'f')) { const ic = v === 'e' || v === 'f'; const w = ic ? r * 5.5 : r * 3.9, tx = ic ? r * 3.55 : r * 1.95;
      s += `<g transform="translate(${ME.x} ${ME.y}) rotate(${opt.rot || 0}) translate(${r * 1.9} ${-r * 1.1}) scale(${v === 'f' ? 1.55 : 1})"><rect x="0" y="${-r * .95}" width="${w}" height="${r * 1.9}" rx="${r * .95}" fill="var(--accent)"/>${ic ? `<g transform="translate(${r * .55} ${-r * .62}) scale(${r * 1.25 / 24})" fill="none" stroke="#14171c" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M4 8h3l1.500-2.500h7L17 8h3v11H4z"/><circle cx="12" cy="13.200" r="3.300"/></g>` : ''}<text x="${tx}" y="${r * .45}" text-anchor="middle" font-size="${r * 1.25}" font-weight="700" fill="#14171c">3:12</text></g>`; }
  }
  return s;
}

const I = {

};

} else if (['keys', 'overlay', 'presets', 'loc', 'data', 'prof'].includes(scene)) {
  const keys = `<div class="cols">

        ${[['显示 / 隐藏', 'F6'], ['展开', '按住', 'Caps'], ['放大', '='], ['缩小', '-'], ['上一层', 'PgUp'], ['下一层', 'PgDn'], ['朝向 / 朝北', 'F7'], ['接管鼠标', '按住', 'F8'], ['切换底图', null]]
          .map(([a, ...k]) => `<div class="row">${a}<span class="r">${k.map(x => x === null ? '<span class="key none">＋</span>' : x === '按住' ? '<span style="color:var(--muted);font-size:12px">按住</span>' : `<span class="key">${x}</span>`).join('')}</span></div>`).join('')}</div>

    </div>`;
  const ov = `
